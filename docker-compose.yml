services:
  postgres:
    image: postgres:16-alpine
    container_name: tzconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tzconnect
      POSTGRES_PASSWORD: tzconnect
      POSTGRES_DB: tzconnect
    ports:
      - "5432:5432"
    volumes:
      - tzconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzconnect -d tzconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tzconnect-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tzconnect_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tzconnect_pgdata:
  tzconnect_redisdata:
